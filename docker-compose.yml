services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the environment or .env file}
      JsonDatabase__FilePath: /var/data/busbooking.json
    volumes:
      - ./data:/var/data
